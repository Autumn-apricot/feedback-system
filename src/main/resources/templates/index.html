<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>企业内部意见反馈系统</title>
    <style>
        :root {
            --cyan: #00e5ff;
            --purple: #b388ff;
            --bg: #0a0a1a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: var(--bg);
            min-height: 100vh; overflow: hidden;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            position: relative;
        }
        /* 动态星空背景 */
        body::before {
            content: '';
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background:
                radial-gradient(2px 2px at 10% 20%, rgba(0,229,255,0.8), transparent),
                radial-gradient(2px 2px at 25% 55%, rgba(179,136,255,0.8), transparent),
                radial-gradient(1px 1px at 40% 10%, rgba(0,229,255,0.6), transparent),
                radial-gradient(2px 2px at 55% 75%, rgba(179,136,255,0.7), transparent),
                radial-gradient(1px 1px at 70% 30%, rgba(0,229,255,0.5), transparent),
                radial-gradient(2px 2px at 85% 60%, rgba(179,136,255,0.6), transparent),
                radial-gradient(1px 1px at 15% 80%, rgba(0,229,255,0.7), transparent),
                radial-gradient(2px 2px at 60% 45%, rgba(255,255,255,0.4), transparent),
                radial-gradient(1px 1px at 90% 15%, rgba(179,136,255,0.5), transparent),
                radial-gradient(2px 2px at 35% 90%, rgba(0,229,255,0.6), transparent),
                radial-gradient(1px 1px at 50% 5%, rgba(255,255,255,0.3), transparent),
                radial-gradient(1px 1px at 78% 85%, rgba(179,136,255,0.4), transparent);
            animation: twinkle 4s ease-in-out infinite alternate;
            z-index: 0;
        }
        @keyframes twinkle {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }
        /* 浮动光晕 */
        .glow-orb {
            position: fixed; border-radius: 50%; filter: blur(120px);
            opacity: 0.15; z-index: 0; pointer-events: none;
            animation: float 8s ease-in-out infinite;
        }
        .glow-orb.orb1 {
            width: 400px; height: 400px;
            background: var(--cyan);
            top: -100px; left: -100px;
            animation-delay: 0s;
        }
        .glow-orb.orb2 {
            width: 350px; height: 350px;
            background: var(--purple);
            bottom: -120px; right: -80px;
            animation-delay: -4s;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(40px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }
        /* 主体内容 */
        .hero {
            position: relative; z-index: 1; text-align: center; padding: 50px 30px;
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            box-shadow: 0 0 80px rgba(0,229,255,0.08), 0 0 40px rgba(179,136,255,0.05);
        }
        .hero .logo-icon {
            font-size: 72px; margin-bottom: 16px;
            animation: bounce 2s ease-in-out infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        .hero h1 {
            font-size: 38px; font-weight: 900; letter-spacing: 3px;
            background: linear-gradient(90deg, var(--cyan), #84ffff, var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        .hero .subtitle {
            color: rgba(255,255,255,0.5); font-size: 15px;
            letter-spacing: 4px; margin-bottom: 45px;
        }
        .btn-group { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; }
        .btn {
            position: relative; display: inline-block;
            padding: 18px 48px; font-size: 17px; font-weight: bold;
            text-decoration: none; border-radius: 50px;
            letter-spacing: 2px; overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-submit {
            background: transparent; color: var(--cyan);
            border: 2px solid var(--cyan);
            box-shadow: 0 0 20px rgba(0,229,255,0.2), inset 0 0 20px rgba(0,229,255,0.05);
        }
        .btn-submit:hover {
            background: var(--cyan); color: #0a0a1a;
            box-shadow: 0 0 50px rgba(0,229,255,0.5), 0 0 100px rgba(0,229,255,0.2);
            transform: translateY(-4px);
        }
        .btn-list {
            background: transparent; color: var(--purple);
            border: 2px solid var(--purple);
            box-shadow: 0 0 20px rgba(179,136,255,0.2), inset 0 0 20px rgba(179,136,255,0.05);
        }
        .btn-list:hover {
            background: var(--purple); color: #0a0a1a;
            box-shadow: 0 0 50px rgba(179,136,255,0.5), 0 0 100px rgba(179,136,255,0.2);
            transform: translateY(-4px);
        }
        /* 底部标识 */
        .footer {
            position: fixed; bottom: 0; left: 0; width: 100%;
            text-align: center; padding: 16px; z-index: 2;
            background: rgba(10,10,26,0.8);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .footer p { color: rgba(255,255,255,0.45); font-size: 14px; letter-spacing: 1px; }
        .footer span { color: var(--cyan); font-weight: bold; }
    </style>
</head>
<body>
    <div class="glow-orb orb1"></div>
    <div class="glow-orb orb2"></div>

    <div class="hero">
        <div class="logo-icon">🌐</div>
        <h1>企业内部意见反馈系统</h1>
        <p class="subtitle">—— 您的声音 · 我们用心聆听 ——</p>
        <div class="btn-group">
            <a class="btn btn-submit" th:href="@{/submit}">⚡ 提 交 意 见</a>
            <a class="btn btn-list" th:href="@{/list}">🔍 查 看 列 表</a>
        </div>
    </div>

    <div class="footer">
        <p>企业内部意见反馈系统 · Spring Boot + Thymeleaf + Redis + RabbitMQ</p>
    </div>
</body>
</html>
