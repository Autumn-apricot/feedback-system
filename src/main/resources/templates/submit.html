<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>意见提交 - 企业内部意见反馈系统</title>
    <style>
        /* ⚡ 霓虹暗黑风主题 ⚡ */
        :root {
            --cyan: #00e5ff;
            --pink: #ff4081;
            --purple: #b388ff;
            --bg: #0a0a1a;
            --card-bg: rgba(255,255,255,0.03);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: var(--bg); min-height: 100vh;
            display: flex; flex-direction: column;
        }
        /* 顶部导航条 */
        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 30px;
            background: rgba(10,10,26,0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0,229,255,0.15);
            flex-shrink: 0;
        }
        .topbar .brand {
            font-size: 18px; font-weight: 900; letter-spacing: 2px;
            background: linear-gradient(90deg, var(--cyan), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .topbar .nav-links a {
            color: rgba(255,255,255,0.6); text-decoration: none;
            font-size: 14px; margin-left: 25px;
            transition: color 0.3s; letter-spacing: 1px;
        }
        .topbar .nav-links a:hover { color: var(--cyan); }
        .topbar .nav-links a.active { color: var(--cyan); border-bottom: 2px solid var(--cyan); padding-bottom: 4px; }

        /* 主体 */
        .container {
            flex: 1; display: flex; justify-content: center;
            align-items: center; padding: 40px 20px;
        }
        /* 玻璃拟态表单卡片 */
        .form-card {
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px; padding: 45px 40px;
            width: 100%; max-width: 560px;
            box-shadow: 0 0 60px rgba(0,229,255,0.06), 0 0 30px rgba(179,136,255,0.04);
            position: relative; overflow: hidden;
        }
        /* 卡片顶部发光边框 */
        .form-card::before {
            content: '';
            position: absolute; top: 0; left: 20%; width: 60%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--cyan), var(--purple), transparent);
        }
        .form-card h2 {
            text-align: center; font-size: 24px; font-weight: 900;
            letter-spacing: 3px; margin-bottom: 35px;
            background: linear-gradient(90deg, var(--cyan), #fff, var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        /* 表单组 */
        .form-group { margin-bottom: 22px; }
        .form-group label {
            display: block; color: rgba(255,255,255,0.7);
            font-size: 13px; letter-spacing: 2px;
            margin-bottom: 10px; font-weight: 600;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 14px 18px;
            font-size: 15px; color: #fff;
            transition: all 0.3s ease;
            font-family: inherit;
            outline: none;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 20px rgba(0,229,255,0.15), inset 0 0 10px rgba(0,229,255,0.03);
            background: rgba(255,255,255,0.06);
        }
        .form-group textarea { min-height: 160px; resize: vertical; }
        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: rgba(255,255,255,0.25);
        }
        /* 按钮 */
        .btn-row { text-align: center; margin-top: 30px; }
        .btn-submit {
            position: relative; padding: 16px 60px;
            font-size: 16px; font-weight: bold; letter-spacing: 3px;
            border: none; border-radius: 50px; cursor: pointer;
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            color: #0a0a1a;
            box-shadow: 0 0 30px rgba(0,229,255,0.25);
            transition: all 0.3s ease;
            overflow: hidden;
        }
        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 50px rgba(0,229,255,0.4), 0 0 80px rgba(179,136,255,0.2);
        }
        .btn-submit:active { transform: scale(0.97); }
        .btn-back {
            display: inline-block; margin-top: 18px;
            color: rgba(255,255,255,0.4); text-decoration: none;
            font-size: 13px; letter-spacing: 1px;
            transition: color 0.3s;
        }
        .btn-back:hover { color: var(--purple); }

        /* 底部 */
        .footer {
            text-align: center; padding: 15px; flex-shrink: 0;
            background: rgba(10,10,26,0.9); backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .footer p { color: rgba(255,255,255,0.4); font-size: 13px; letter-spacing: 1px; }
        .footer span { color: var(--pink); font-weight: bold; }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="brand">⚡ FEEDBACK</div>
        <div class="nav-links">
            <a class="active" th:href="@{/submit}">提交意见</a>
            <a th:href="@{/list}">意见列表</a>
        </div>
    </div>

    <div class="container">
        <div class="form-card">
            <h2>✍ 提交您的意见</h2>
            <!-- 表单绑定：th:action 指定提交地址，th:object + th:field 双向绑定实体字段 -->
            <form th:action="@{/submit}" th:object="${feedback}" method="post">
                <div class="form-group">
                    <label>👤 您的姓名</label>
                    <input type="text" th:field="*{username}"
                           placeholder="请输入您的姓名..." required maxlength="50" />
                </div>
                <div class="form-group">
                    <label>💬 意见内容</label>
                    <textarea th:field="*{content}"
                              placeholder="请畅所欲言，写下您的意见或建议..." required></textarea>
                </div>
                <div class="btn-row">
                    <button type="submit" class="btn-submit">🚀 发 送 意 见</button>
                </div>
            </form>
            <div style="text-align: center;">
                <a class="btn-back" th:href="@{/list}">← 查看所有意见列表</a>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>企业内部意见反馈系统 · Spring Boot + Thymeleaf + Redis + RabbitMQ</p>
    </div>
</body>
</html>
