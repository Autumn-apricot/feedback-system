<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>意见列表 - 企业内部意见反馈系统</title>
    <style>
        /* ⚡ 霓虹暗黑风主题 ⚡ */
        :root {
            --cyan: #00e5ff;
            --pink: #ff4081;
            --purple: #b388ff;
            --green: #69f0ae;
            --bg: #0a0a1a;
            --card-bg: rgba(255,255,255,0.03);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: var(--bg); min-height: 100vh;
            display: flex; flex-direction: column;
        }
        /* 顶部导航 */
        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 30px;
            background: rgba(10,10,26,0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0,229,255,0.15);
            flex-shrink: 0;
        }
        .topbar .brand {
            font-size: 18px; font-weight: 900; letter-spacing: 2px;
            background: linear-gradient(90deg, var(--cyan), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .topbar .nav-links a {
            color: rgba(255,255,255,0.6); text-decoration: none;
            font-size: 14px; margin-left: 25px;
            transition: color 0.3s; letter-spacing: 1px;
        }
        .topbar .nav-links a:hover { color: var(--cyan); }
        .topbar .nav-links a.active { color: var(--cyan); border-bottom: 2px solid var(--cyan); padding-bottom: 4px; }

        /* 主体 */
        .container {
            flex: 1; max-width: 960px; margin: 0 auto;
            padding: 35px 20px 50px; width: 100%;
        }
        /* 统计栏 */
        .stats-bar {
            display: flex; gap: 20px; margin-bottom: 30px;
        }
        .stat-item {
            flex: 1; padding: 22px 20px; text-align: center;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
        }
        .stat-item .num {
            font-size: 36px; font-weight: 900;
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-item .lbl { color: rgba(255,255,255,0.45); font-size: 12px; letter-spacing: 2px; margin-top: 6px; }

        /* 列表卡片 */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px; padding: 35px;
            box-shadow: 0 0 60px rgba(0,229,255,0.05);
            position: relative; overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute; top: 0; left: 20%; width: 60%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--cyan), var(--purple), transparent);
        }
        .card h2 {
            text-align: center; font-size: 22px; font-weight: 900;
            letter-spacing: 3px; margin-bottom: 25px;
            background: linear-gradient(90deg, var(--cyan), #fff, var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        /* 表格 */
        table { width: 100%; border-collapse: collapse; }
        thead th {
            padding: 14px 12px; text-align: left;
            color: rgba(255,255,255,0.5); font-size: 11px;
            letter-spacing: 2px; font-weight: 600;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        tbody td {
            padding: 16px 12px; font-size: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.75);
            vertical-align: top;
        }
        tbody tr { transition: all 0.3s ease; }
        tbody tr:hover {
            background: rgba(0,229,255,0.04);
        }
        tbody tr:hover td { color: #fff; }
        /* 序号列样式 */
        .idx-badge {
            display: inline-flex; align-items: center; justify-content: center;
            width: 30px; height: 30px; border-radius: 50%;
            background: linear-gradient(135deg, rgba(0,229,255,0.15), rgba(179,136,255,0.15));
            color: var(--cyan); font-size: 12px; font-weight: bold;
            border: 1px solid rgba(0,229,255,0.2);
        }
        /* 用户名彩色标签 */
        .user-tag {
            display: inline-block; padding: 4px 14px;
            border-radius: 20px; font-size: 13px; font-weight: 600;
            background: rgba(179,136,255,0.15);
            color: var(--purple);
            border: 1px solid rgba(179,136,255,0.2);
        }
        /* 空状态 */
        .empty-state {
            text-align: center; padding: 50px 20px;
        }
        .empty-state .icon { font-size: 64px; margin-bottom: 16px; }
        .empty-state .msg { color: rgba(255,255,255,0.3); font-size: 15px; letter-spacing: 2px; }

        /* 按钮 */
        .btn-row { text-align: center; margin-top: 25px; }
        .btn-submit {
            display: inline-block; padding: 14px 40px;
            font-size: 14px; font-weight: bold; letter-spacing: 3px;
            text-decoration: none; border-radius: 50px;
            background: transparent; color: var(--cyan);
            border: 2px solid var(--cyan);
            transition: all 0.3s ease;
        }
        .btn-submit:hover {
            background: var(--cyan); color: #0a0a1a;
            box-shadow: 0 0 30px rgba(0,229,255,0.4);
            transform: translateY(-2px);
        }

        /* 页面底部 */
        .footer {
            text-align: center; padding: 15px; flex-shrink: 0;
            background: rgba(10,10,26,0.9); backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .footer p { color: rgba(255,255,255,0.4); font-size: 13px; letter-spacing: 1px; }
        .footer span { color: var(--pink); font-weight: bold; }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="brand">⚡ FEEDBACK</div>
        <div class="nav-links">
            <a th:href="@{/submit}">提交意见</a>
            <a class="active" th:href="@{/list}">意见列表</a>
        </div>
    </div>

    <div class="container">
        <!-- 统计栏 -->
        <div class="stats-bar">
            <div class="stat-item">
                <div class="num" th:text="${#lists.size(feedbacks)}">0</div>
                <div class="lbl">📋 意见总数</div>
            </div>
            <div class="stat-item">
                <div class="num">🌐</div>
                <div class="lbl">状态：公开透明</div>
            </div>
            <div class="stat-item">
                <div class="num">⚡</div>
                <div class="lbl">Redis 缓存加速</div>
            </div>
        </div>

        <!-- 意见列表 -->
        <div class="card">
            <h2>📋 意见反馈列表</h2>

            <div th:if="${#lists.isEmpty(feedbacks)}" class="empty-state">
                <div class="icon">🪐</div>
                <p class="msg">还没有意见反馈，来做第一个发声的人吧！</p>
            </div>

            <table th:if="${not #lists.isEmpty(feedbacks)}">
                <thead>
                    <tr>
                        <th style="width:8%">序号</th>
                        <th style="width:18%">提交人</th>
                        <th style="width:50%">意见内容</th>
                        <th style="width:24%">提交时间</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- th:each 遍历集合渲染表格行，stat.index 提供从 0 开始的序号 -->
                    <tr th:each="fb, stat : ${feedbacks}">
                        <td><span class="idx-badge" th:text="${stat.index + 1}">1</span></td>
                        <td><span class="user-tag" th:text="${fb.username}">用户</span></td>
                        <td th:text="${fb.content}">意见内容...</td>
                        <td th:text="${#temporals.format(fb.createTime, 'yyyy-MM-dd HH:mm:ss')}"
                            style="color:rgba(255,255,255,0.4); font-size:13px;">时间</td>
                    </tr>
                </tbody>
            </table>

            <div class="btn-row">
                <a class="btn-submit" th:href="@{/submit}">✍ 去提交意见</a>
            </div>
        </div>

    </div>

    <div class="footer">
        <p>企业内部意见反馈系统 · Spring Boot + Thymeleaf + Redis + RabbitMQ</p>
    </div>
</body>
</html>
