# ==========================================
# 测试环境配置（由 @ActiveProfiles("test") 激活）
#
# 目的：让 mvn test 在任意机器上都能直接跑通——
#       不要求本机先装好并启动 MySQL / Redis / RabbitMQ。
#       做法是把三样外部中间件都换成进程内的等价实现，
#       业务代码与 SQL 语句本身不做任何改动。
# ==========================================

# ---------- 内嵌容器端口（集成测试用 RANDOM_PORT 时会再被覆盖）----------
server.port=0

# ---------- 数据库：H2 内存库（MySQL 兼容模式）替代 MySQL ----------
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:feedback_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# 启动时执行建表脚本（结构刻意与 MySQL 的 feedback 表保持一致）
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql
spring.sql.init.encoding=UTF-8

# ---------- 缓存：JVM 内存实现替代 Redis ----------
# RedisConfig 已标注 @Profile("!test")，这里补上 Spring Cache 的兜底实现，
# 使 @Cacheable / @CacheEvict 注解语义仍可被测试验证。
spring.cache.type=simple

# ---------- 消息：不连 Broker ----------
# 监听容器不启动，避免测试时反复尝试连接不存在的 RabbitMQ；
# 发送端的 RabbitTemplate 由测试类用 @MockBean 替换，直接断言发送内容。
spring.rabbitmq.listener.simple.auto-startup=false

# ---------- 日志：关掉 MyBatis-Plus 的 SQL 控制台输出，保持测试日志干净 ----------
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl

# ---------- 模板：关闭缓存，便于断言渲染结果 ----------
spring.thymeleaf.cache=false
